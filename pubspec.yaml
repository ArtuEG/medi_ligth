name: medi_ligth
description: "MediLight - app de comunicación, seguridad y recursos para enfermería."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management (presentation layer) - ChangeNotifier + provider
  provider: ^6.1.2

  # Tipografía Poppins sin empaquetar archivos
  google_fonts: ^6.2.1

  # Logo de marca (SVG con gradiente: corazón + pulso ECG + cruz)
  flutter_svg: ^2.0.10+1

  # Cliente HTTP para los repositorios de la capa data
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
